name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 90d6b98fd86d20981ee06ddd5b7d93e4320f26a4
          path: hermes
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.22'
      - name: Install supported runtime from lock
        working-directory: hermes
        run: uv sync --locked --python 3.14
      - name: Tests and native validation
        env:
          HERMES_HOME: ${{ runner.temp }}/coach-home
          HERMES_SOURCE: ${{ github.workspace }}/hermes
        working-directory: hermes
        run: |
          mkdir -p "$HERMES_HOME"
          uv run --with pytest==9.2.0 python -m pytest ../plugin/tests -q
          uv run hermes plugins validate ../plugin --json
          cd ../plugin
          sha256sum -c protocol.sha256
